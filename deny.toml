[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser (via cosmic-text -> fontdb) is unmaintained with no successor release yet.
    # D-cut only parses its own embedded Noto Sans font, never untrusted font files.
    # Re-evaluate when cosmic-text/fontdb move off ttf-parser. See docs/DECISIONS.md.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained; only the bundled font is parsed" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
