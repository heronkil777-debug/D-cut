[workspace]
resolver = "3"
members = [
    "crates/editor-core",
    "crates/editor-media",
    "crates/editor-project",
    "crates/editor-render",
    "crates/editor-effects",
    "crates/editor-export",
    "crates/editor-text",
    "crates/editor-ui",
    "crates/editor-cli",
]
default-members = [
    "crates/editor-core",
    "crates/editor-media",
    "crates/editor-project",
    "crates/editor-render",
    "crates/editor-effects",
    "crates/editor-export",
    "crates/editor-text",
    "crates/editor-ui",
    "crates/editor-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates (the provisional `editor-` prefix lives here and in the crate manifests).
editor-core = { path = "crates/editor-core", version = "0.1.0" }
editor-media = { path = "crates/editor-media", version = "0.1.0" }
editor-project = { path = "crates/editor-project", version = "0.1.0" }
editor-render = { path = "crates/editor-render", version = "0.1.0" }
editor-text = { path = "crates/editor-text", version = "0.1.0" }
editor-export = { path = "crates/editor-export", version = "0.1.0" }
editor-effects = { path = "crates/editor-effects", version = "0.1.0" }
anyhow = "1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui = "0.37.0"
egui-wgpu = { version = "0.37.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
