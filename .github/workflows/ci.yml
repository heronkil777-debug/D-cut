name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libasound2-dev libgl1-mesa-dev libvulkan-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev pkg-config ffmpeg mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests (golden images on lavapipe with a larger tolerance)
        env:
          D_CUT_GOLDEN_TOLERANCE: "8"
        run: cargo test --workspace
      - name: Run FFmpeg CLI integration workflow
        run: |
          cargo build -p editor-cli
          scripts/test-media-workflow.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency licenses and advisories
        run: cargo deny check

  appimage:
    name: Build AppImage on tags
    if: startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in the Ubuntu 22.04 container
        run: scripts/build-appimage.sh
      - name: Create zsync metadata
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
          appimage=build/appimage/D-cut-x86_64.AppImage
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/D-cut-x86_64.AppImage"
          zsyncmake -u "$download_url" -o "${appimage}.zsync" "$appimage"
      - uses: actions/upload-artifact@v4
        with:
          name: D-cut-AppImage
          path: |
            build/appimage/D-cut-x86_64.AppImage
            build/appimage/D-cut-x86_64.AppImage.sha256
            build/appimage/D-cut-x86_64.AppImage.zsync
          if-no-files-found: error
